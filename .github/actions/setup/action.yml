name: Setup
description: Enable Corepack, setup Node, cache Yarn 4, install dependencies

runs:
  using: composite
  steps:
    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc

    # Yarn 4 stores its cache in .yarn/cache (per-project), not in the global
    # location that actions/setup-node's `cache: yarn` covers. Cache explicitly.
    - name: Cache Yarn 4
      uses: actions/cache@v4
      with:
        path: |
          .yarn/cache
          .yarn/install-state.gz
        key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
        restore-keys: |
          yarn-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: yarn install --immutable
