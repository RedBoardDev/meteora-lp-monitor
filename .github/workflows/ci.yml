name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (typecheck + lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install --immutable
      - run: make verify

  apps:
    name: Swift package (MeteoraLPMonitorKit)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd apps/MeteoraLPMonitorKit && swift test
