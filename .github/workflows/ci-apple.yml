name: CI / Apple

# Build + test the shared Swift package (BinsightKit) on a macOS runner. The main CI never
# compiles Swift, so a kit regression (e.g. an auth-flow change) would otherwise ship unnoticed. Only
# the SwiftPM kit is built — the macOS/iOS app targets need XcodeGen + signing and are out of CI scope.
# Path-gated because macOS runner minutes are scarce/expensive.

on:
  push:
    branches: [main]
    paths:
      - 'apps/BinsightKit/**'
      - '.github/workflows/ci-apple.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/BinsightKit/**'
      - '.github/workflows/ci-apple.yml'

permissions:
  contents: read

concurrency:
  group: ci-apple-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kit:
    name: Swift kit (build + test)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build + test BinsightKit
        working-directory: apps/BinsightKit
        run: |
          swift build
          swift test
