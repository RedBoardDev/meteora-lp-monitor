<!-- Binsight mark — concentrated-liquidity bins, the active (center) bin brightest. Frameless. -->
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FECFF"/><stop offset="1" stop-color="#1FC6E0"/>
    </linearGradient>
    <linearGradient id="peak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B6F4FF"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect x="68" y="265" width="56" height="135" rx="28" fill="url(#bar)" opacity=".58"/>
  <rect x="148" y="184" width="56" height="216" rx="28" fill="url(#bar)" opacity=".85"/>
  <rect x="228" y="100" width="56" height="300" rx="28" fill="url(#peak)"/>
  <rect x="308" y="184" width="56" height="216" rx="28" fill="url(#bar)" opacity=".85"/>
  <rect x="388" y="265" width="56" height="135" rx="28" fill="url(#bar)" opacity=".58"/>
</svg>
