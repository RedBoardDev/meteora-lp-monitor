<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Meteora LP Monitor</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #14161b;
        color: #f1f3f6;
        font-family:
          ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 12px;
        text-align: center;
        padding: 24px;
      }
      h1 {
        font-size: 18px;
        font-weight: 600;
        margin: 0;
      }
      p {
        color: #aeb4c0;
        font-size: 14px;
        margin: 0;
        max-width: 28rem;
        line-height: 1.5;
      }
      button {
        margin-top: 8px;
        background: #bef264;
        color: #14161b;
        border: 0;
        border-radius: 10px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>You're offline</h1>
      <p>Meteora LP Monitor needs a connection for live on-chain data. It'll reconnect automatically — or retry now.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
