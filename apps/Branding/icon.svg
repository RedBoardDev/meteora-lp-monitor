<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161E2B"/>
      <stop offset="1" stop-color="#0A0E15"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="0.55" stop-color="#34D399"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- watcher ring (subtle) -->
  <circle cx="512" cy="512" r="332" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2"/>
  <circle cx="512" cy="512" r="300" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="20" stroke-dasharray="4 26" stroke-linecap="round"/>

  <!-- range bounds (min / max ticks) -->
  <rect x="236" y="476" width="10" height="72" rx="5" fill="#FFFFFF" fill-opacity="0.18"/>
  <rect x="778" y="476" width="10" height="72" rx="5" fill="#FFFFFF" fill-opacity="0.18"/>

  <!-- range track -->
  <rect x="256" y="496" width="512" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.07"/>
  <!-- range bar (green -> amber) -->
  <rect x="256" y="496" width="512" height="32" rx="16" fill="url(#bar)"/>

  <!-- position dot: glow + core -->
  <circle cx="600" cy="512" r="120" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="600" cy="512" r="58" fill="#0A0E15"/>
  <circle cx="600" cy="512" r="46" fill="#F8FAFC"/>
  <circle cx="600" cy="512" r="46" fill="none" stroke="#34D399" stroke-width="6"/>
</svg>
