nodeLinker: node-modules

nmMode: hardlinks-local

enableGlobalCache: false

compressionLevel: mixed

enableTelemetry: false

# Native deps (esbuild via tsup/vitest/next, sharp, bufferutil/utf-8-validate) need their build
# scripts — Yarn 4.15 disables them by default, so opt back in (verified: a fresh install builds them).
enableScripts: true

# Yarn 4.15 supply-chain age gate left disabled so installs aren't blocked on freshly-published deps.
npmMinimalAgeGate: 0

supportedArchitectures:
  os:
    - current
    - linux
    - darwin
  cpu:
    - current
    - x64
    - arm64
  libc:
    - current
    - glibc
    - musl

defaultSemverRangePrefix: ""

logFilters:
  - code: YN0013
    level: discard
  - code: YN0076
    level: discard
