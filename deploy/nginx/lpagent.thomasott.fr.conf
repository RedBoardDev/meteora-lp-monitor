# Host nginx vhost for the Meteora LP Monitor.
# Place at /etc/nginx/sites-available/lpagent.thomasott.fr.conf and symlink into sites-enabled,
# then obtain the certificate (see deploy/README.md). The app containers listen on 127.0.0.1.
#
#   "/"      -> web   (Next.js, 127.0.0.1:3000) — serves the UI and the /api/* BFF.
#   "/live"  -> api   (WebSocket, 127.0.0.1:8787) — the only API route exposed publicly.

# WebSocket upgrade helper (maps the Connection header).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name lpagent.thomasott.fr;

    # Let's Encrypt HTTP-01 challenge, then redirect everything else to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lpagent.thomasott.fr;

    ssl_certificate     /etc/letsencrypt/live/lpagent.thomasott.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lpagent.thomasott.fr/privkey.pem;

    # The API WebSocket feed — the browser connects here directly with a short-lived ticket.
    location /live {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Everything else -> the Next.js web app (UI + the /api/* BFF that talks to the API internally).
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
