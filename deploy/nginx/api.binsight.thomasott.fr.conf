# Host nginx vhost for the Binsight API (native clients: macOS menu-bar app + iOS app).
# Place at /etc/nginx/sites-available/api.binsight.thomasott.fr.conf and symlink into sites-enabled,
# then obtain the certificate (see deploy/README.md). The api container listens on 127.0.0.1:8787.
#
# The browser keeps using binsight.thomasott.fr (web UI + /api BFF + /live WS). Native clients
# auth themselves (wallet-address + password -> JWT) and hit the API directly, so they need the
# whole API surface (REST + the /live WebSocket) exposed on its own host: api.binsight.thomasott.fr.
#
# NOTE: the $connection_upgrade map is already defined (http scope) in binsight.thomasott.fr.conf —
# do NOT redefine it here (a duplicate map directive is a fatal nginx error).

server {
    listen 80;
    listen [::]:80;
    server_name api.binsight.thomasott.fr;

    # Let's Encrypt HTTP-01 challenge, then redirect everything else to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.binsight.thomasott.fr;

    ssl_certificate     /etc/letsencrypt/live/api.binsight.thomasott.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.binsight.thomasott.fr/privkey.pem;

    # The whole API -> the api container. Upgrade headers are harmless on plain REST and
    # required for the /live WebSocket; the long timeouts keep that socket alive.
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
